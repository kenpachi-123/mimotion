name: Keep step threshold

# 防止 Sync fork 或其他改动把 main.py 的满额时间改回 22 点
# 一旦发现 22 点阈值，就自动恢复为 12 点并提交
on:
  push:
    paths:
      - main.py
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }}

      - name: Restore 12:00 threshold
        run: |
          if grep -qF '/ (22 * 60), 1)' main.py; then
            sed -i 's|/ (22 \* 60), 1)|/ (12 * 60), 1)|' main.py
            if ! grep -qF '/ (12 * 60), 1)' main.py; then
              echo '自动修改失败，请手动检查 main.py' >&2
              exit 1
            fi
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git add main.py
            git commit -m 'fix: 自动恢复步数满额时间为12点'
            for i in 1 2 3; do
              if git push origin master; then
                echo '已自动恢复 12 点阈值并推送'
                exit 0
              fi
              git pull --rebase origin master
            done
            echo '推送失败，请手动检查' >&2
            exit 1
          else
            echo 'main.py 已是 12 点阈值，无需修改'
          fi
